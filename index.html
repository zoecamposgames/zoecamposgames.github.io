<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Zoë Marie Campos ₊ ⊹</title>
  <style>
    :root {
      --bg-color: #faf8f5;     /* Warm, minimal cream backdrop */
      --text-color: #2b2b2b;
      --accent-color: #bfa3ff;   /* Pastel purple accent */
      --card-bg: #ffffff;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 100;
    }

    .logo {
      font-weight: 500;
      letter-spacing: 0.1em;
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-color);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      margin-left: 1.5rem;
      opacity: 0.7;
    }

    /* Top Right Flag Dropdown */
    .dropdown {
      position: relative;
    }

    .dropdown-btn {
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flag-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      background-color: white;
      min-width: 140px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .dropdown.open .dropdown-content {
      display: block;
    }

    .dropdown-item {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background-color: #f7f5f9;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    h1 {
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      font-size: 2.5rem;
    }

    .hero-sub {
      font-size: 1.2rem;
      color: #555;
      line-height: 1.6;
      max-width: 700px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 3rem;
      margin-top: 4rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(0,0,0,0.04);
      border-radius: 20px;
      padding: 1.25rem;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
      background-color: #eee;
    }

    .lore-section {
      background-color: white;
      padding: 6rem 2rem;
      margin-top: 8rem;
    }

    .lore-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .lang-en, .lang-ja, .lang-es {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">zoë marie campos ✿</div>
    <div class="nav-container">
      <nav class="nav-links">
        <a href="#projects">projects</a>
        <a href="#lore">lore</a>
      </nav>
      
      <div class="dropdown" id="langDropdown">
        <button class="dropdown-btn" onclick="toggleDropdown(event)">
          <img id="currentFlag" class="flag-circle" src="https://flagcdn.com/w40/us.png" alt="Flag">
          <span id="currentLabel">English</span>
        </button>
        <div class="dropdown-content">
          <button class="dropdown-item" onclick="setLanguage('en', 'English', 'https://flagcdn.com/w40/us.png')">
            <img class="flag-circle" src="https://flagcdn.com/w40/us.png"> English
          </button>
          <button class="dropdown-item" onclick="setLanguage('ja', '日本語', 'https://flagcdn.com/w40/jp.png')">
            <img class="flag-circle" src="https://flagcdn.com/w40/jp.png"> 日本語
          </button>
          <button class="dropdown-item" onclick="setLanguage('es', 'Español', 'https://flagcdn.com/w40/pr.png')">
            <img class="flag-circle" src="https://flagcdn.com/w40/pr.png"> Español
          </button>
        </div>
      </div>
    </div>
  </header>

   <main>
    <section>
      <h1 id="hero-title"></h1>
      <p class="hero-sub" id="hero-bio"></p>
    </section>

    <section id="projects">
      <div class="grid">
        <!-- Triage Card -->
        <div class="card">
          <img src="assets/triage.jpg" alt="Triage">
          <h3>Triage</h3>
          <p id="triage-desc"></p>
        </div>

        <!-- Queen Bee Card -->
        <div class="card">
          <img src="assets/queenbee.jpg" alt="Queen Bee">
          <h3>Queen Bee</h3>
          <p id="queenbee-desc"></p>
        </div>

        <!-- Golfin Card -->
        <div class="card">
          <img src="assets/golfin.jpg" alt="Golfin">
          <h3>Golfin</h3>
          <p id="golfin-desc"></p>
        </div>

        <!-- Pragmata Card -->
        <div class="card">
          <img src="assets/pragmata.jpg" alt="Pragmata Prototype">
          <h3>Pragmata Prototype</h3>
          <p id="pragmata-desc"></p>
        </div>

        <!-- Co-op Adventure Card -->
        <div class="card">
          <img src="assets/coop.jpg" alt="Co-op Adventure Game">
          <h3>Co-op Adventure</h3>
          <p id="coop-desc"></p>
        </div>
      </div>
    </section>
  </main>

  <section class="lore-section" id="lore">
    <div class="lore-container">
      <h2 id="lore-title"></h2>
      <div class="hero-sub">
        <p id="lore-body"></p>
      </div>
    </div>
  </section>
  
  <script>
    const translations = {
      "en": {
        "heroTitle": "hi, i'm zoë!",
        "heroBio": "I am currently a Gameplay Programmer at C&R Creative Studios in Osaka, Japan. Coming from a game design background, I combine creativity and technology to build engaging player experiences using Unreal Engine 5 and Unity.",
        "triageDesc": "Built in Unreal Engine 5 and released on Steam. Diagnose symptoms and make life-or-death decisions in an afflicted town.",
        "queenbeeDesc": "Developed in Unity 3D. A whimsical platformer built by a team of six developers where you control a swarm of bees.",
        "golfinDesc": "Built in Unity 3D during my internship in Kyoto, Japan. Touched both the physics backbone and UI/UX implementation.",
        "pragmataDesc": "Unreal Engine 5 & C++ third-person shooter prototype. Features a custom Game Instance Subsystem hacking grid minigame, data-driven architecture via Data Tables, and advanced Behavior Tree enemy AI.",
        "coopDesc": "Multiplayer adventure game engineered in UE5 & C++ utilizing the Steam Online Subsystem. Features custom Multiplayer Sessions, RPC architecture replication, and server-synchronized environmental puzzles.",
        "loreTitle": "my lore…",
        "loreBody": "I graduated in 2025 as a proud first-generation college graduate, turning my deep background in game design into a full-time career in gameplay programming. Moving to Japan to engineer games at C&R Creative Studios in Osaka has been an incredible leap of faith. I work dynamically within Unreal Engine 5, Unity, C++, and C# to transform artistic mechanics into highly optimized systems. As an official Women in Games Ambassador, I focus heavily on uplift and inclusion. I make games because I want to bring happiness to people—creating memorable moment-to-moment experiences that deeply connect with players across cultures. Always happy to connect, collaborate, and learn!"
      },
      "ja": {
        "heroTitle": "こんにちは、ゾーイです！",
        "heroBio": "現在、大阪のC&Rクリエイティブスタジオでゲームプレイプログラマーをしています。ゲームデザインの経験を活かし、クリエイティビティと技術を融合させ、Unreal Engine 5やUnityで魅力的な体験を開発しています。",
        "triageDesc": "Unreal Engine 5で開発され、Steamでリリース。病に侵された町で症状を診断し、生と死の決断を下します。",
        "queenbeeDesc": "Unity 3Dで開発。6人の開発者チームで制作された、蜂の群れを操作して進むポップな3Dアクションゲーム。",
        "golfinDesc": "京都でのインターンシップ中にUnity 3Dで制作したモバイルゴルフゲーム。物理挙動の基礎からUI/UXの実装まで担当。",
        "pragmataDesc": "Unreal Engine 5 & C++ で開発された三人称視点シューティングの試作。カスタムGame Instance Subsystemによるハッキングのミニゲーム、データテーブルを活用したデータ駆動型設計、および高度なビヘイビアツリー敵AIを実装。",
        "coopDesc": "Steam Online Subsystemを利用した、UE5 & C++製のマルチプレイヤー協力型アドベンチャー。カスタムセッション管理システム、RPCアーキテクチャによる同期レプリケーション、サーバー同期型環境パズルを構築。",
        "loreTitle": "ストーリー…",
        "loreBody": "2025年に家族で初めて大学を卒業し、ゲームデザインで培った経験を活かしてゲームプレイプログラマーとしてのキャリアをスタートしました。大阪のC&Rクリエイティブスタジオでゲーム開発に携わるため日本へ移住したことは、私にとって大きな挑戦であり、かけがえのない経験となっています。現在はUnreal Engine 5、Unity、C++、C#を用いて、アイデアやゲームメカニクスを実際のプレイ体験へと落とし込み、実装しています。また、Women in Games Ambassadorとして、ゲーム業界における多様性とインクルージョンの推進にも積極的に取り組んでいます。私がゲームを作る理由は、人々に楽しさや感動を届けたいからです。文化や言語の壁を越えて、プレイヤーの心に残る体験を生み出せるよう日々挑戦を続けています。新しい出会いやコラボレーションの機会を楽しみにしています。"
      },
      "es": {
        "heroTitle": "¡hola, soy zoë!",
        "heroBio": "Actualmente soy Programadora de Gameplay en C&R Creative Studios en Osaka, Japón. Viniendo de un trasfondo en diseño de videojuegos, combino la creatividad y la tecnología con Unreal Engine 5 y Unity.",
        "triageDesc": "Desarrollado en Unreal Engine 5 y lanzado en Steam. Diagnostica síntomas y toma decisiones de vida o muerte.",
        "queenbeeDesc": "Desarrollado en Unity 3D. Un alegre juego de plataformas en 3D creado por un equipo de seis desarrolladores.",
        "golfinDesc": "Creado en Unity 3D durante mi pasantía en Kioto, Japón. Trabajé tanto en las mecánicas físicas como en el UI/UX.",
        "pragmataDesc": "Prototipo de shooter en tercera persona en Unreal Engine 5 y C++. Cuenta con un minijuego de hackeo basado en un Game Instance Subsystem personalizado, arquitectura de datos mediante Data Tables e IA de enemigos con Behavior Trees.",
        "coopDesc": "Juego de aventura multijugador cooperativo desarrollado en UE5 y C++ utilizando Steam Online Subsystem. Implementa un subsistema personalizado de sesiones multijugador, replicación mediante arquitectura RPC y acertijos ambientales sincronizados con el servidor.",
        "loreTitle": "mi historia…",
        "loreBody": "Me gradué en 2025 como una orgullosa universitaria de primera generación, transformando mis profundas raíces en el diseño de videojuegos en una carrera de tiempo completo en programación de gameplay. Mudarme a Japón para desarrollar juegos en C&R Creative Studios en Osaka han sido un viaje increíble. Trabajo de manera dinámica con Unreal Engine 5, Unity, C++ y C# para transformar mecánicas creativas en sistemas altamente optimizados. Como Embajadora oficial de Women in Games, me enfoco profundamente en la inclusión comunitaria. Hago juegos porque quiero traer felicidad a las personas, creando momentos memorables y experiencias significativas que conecten con los jugadores a través de las culturas. ¡Siempre feliz de conectar, colaborar y aprender de los demás!"
      }
    };

    function toggleDropdown(e) {
      e.stopPropagation();
      document.getElementById('langDropdown').classList.toggle('open');
    }

    function setLanguage(lang, label, flagUrl) {
      document.getElementById('currentLabel').innerText = label;
      document.getElementById('currentFlag').src = flagUrl;
      document.getElementById('hero-title').innerText = translations[lang].heroTitle;
      document.getElementById('hero-bio').innerText = translations[lang].heroBio;
      document.getElementById('triage-desc').innerText = translations[lang].triageDesc;
      document.getElementById('queenbee-desc').innerText = translations[lang].queenbeeDesc;
      document.getElementById('golfin-desc').innerText = translations[lang].golfinDesc;
      document.getElementById('pragmata-desc').innerText = translations[lang].pragmataDesc;
      document.getElementById('coop-desc').innerText = translations[lang].coopDesc;
      document.getElementById('lore-title').innerText = translations[lang].loreTitle;
      document.getElementById('lore-body').innerText = translations[lang].loreBody;
      
      localStorage.setItem('userLang', lang);
      localStorage.setItem('userLabel', label);
      localStorage.setItem('userFlag', flagUrl);
      document.getElementById('langDropdown').classList.remove('open');
    }
    
    window.addEventListener('click', () => {
      document.getElementById('langDropdown').classList.remove('open');
    });
    
    document.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem('userLang') || 'en';
      const savedLabel = localStorage.getItem('userLabel') || 'English';
      const savedFlag = localStorage.getItem('userFlag') || 'https://flagcdn.com/w40/us.png';
      setLanguage(savedLang, savedLabel, savedFlag);
    });
  </script>
</body>
</html>
